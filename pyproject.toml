[project]
name = "groundedqa"
version = "0.1.0"
description = "Answers questions from your own documents, cites every claim, and says so when the answer is not there."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriele Delfini" }]
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=1.26",
    # 2.x bundles layout analysis (onnxruntime and friends); plain text extraction is all we need.
    "pymupdf>=1.24,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "uvicorn>=0.30",
]

[project.scripts]
gqa = "groundedqa.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundedqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF's SWIG bindings trigger these on import under Python 3.12+.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
